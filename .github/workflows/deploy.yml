name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'content/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:  # Allow manual triggering

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and deploy Next.js website
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      IMAGES_BUCKET: ${{ secrets.IMAGES_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        id: build
        run: |
          BUILD_START=$(date +%s)
          npm run build 2>&1 | tee build.log
          BUILD_END=$(date +%s)
          echo "duration=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"
          PAGES=$(grep -oE 'Generating static pages \([0-9]+/' build.log | tail -1 | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$PAGES" ]; then
            PAGES="unknown"
          fi
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_FATHOM_SITE_ID: ${{ secrets.NEXT_PUBLIC_FATHOM_SITE_ID }}
          NEXT_PUBLIC_NEWSLETTER_API_URL: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_API_URL }}
          NEXT_PUBLIC_PHOTO_API_URL: ${{ secrets.NEXT_PUBLIC_PHOTO_API_URL }}
          NEXT_PUBLIC_GISCUS_CATEGORY: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          NEXT_PUBLIC_GISCUS_REPO_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_REPO_ID }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static files to S3
        id: s3sync
        run: |
          SYNC_START=$(date +%s)
          # Sync static assets with long cache (JS, CSS, images)
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.txt"

          # Sync HTML, JSON, and txt files with no cache (for dynamic content)
          # --delete removes orphaned files (e.g. posts set to draft) that are no longer in the build
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "*.txt" \
            --exclude "og/photos/*" \
            --exclude "og/exposures/*" \
            --exclude "og/galleries/*"
          SYNC_END=$(date +%s)
          echo "duration=$((SYNC_END - SYNC_START))" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deploy metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static pages generated | ${{ steps.build.outputs.pages }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build duration | ${{ steps.build.outputs.duration }}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 sync duration | ${{ steps.s3sync.outputs.duration }}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Next.js app built successfully"
          echo "✅ Files synced to S3 bucket: ${{ env.S3_BUCKET }}"
          echo "✅ CloudFront cache invalidated"
          echo "🌐 CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "📊 Static pages: ${{ steps.build.outputs.pages }}"
          echo "⏱️  Build: ${{ steps.build.outputs.duration }}s | S3 sync: ${{ steps.s3sync.outputs.duration }}s"
          echo "ℹ️  Images are managed locally and uploaded to S3 separately"
