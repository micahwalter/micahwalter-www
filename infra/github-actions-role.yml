AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM OIDC role for GitHub Actions to deploy website'

Parameters:
  GitHubOrg:
    Type: String
    Default: micahwalter
    Description: GitHub organization or username

  GitHubRepo:
    Type: String
    Default: micahwalter-www
    Description: GitHub repository name

  WebsiteBucketName:
    Type: String
    Default: ''
    Description: S3 bucket name for website content

  CloudFrontDistributionId:
    Type: String
    Default: ''
    Description: CloudFront distribution ID

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone ID for micahwalter.com

Resources:
  # GitHub OIDC Provider
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: GitHubActionsOIDC

  # IAM Role for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows running on main may assume this role (Phase 4 / micahwalter/aws#35).
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: DeployToS3AndCloudFront
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 permissions for deployment
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}'
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}/*'
              # CloudFront cache invalidation
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource:
                  - !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}'
              # S3 — upload Lambda artifacts for newsletter stacks (both regions)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::micahwalter-newsletter-artifacts
                  - arn:aws:s3:::micahwalter-newsletter-artifacts/*
                  - arn:aws:s3:::micahwalter-newsletter-artifacts-secondary
                  - arn:aws:s3:::micahwalter-newsletter-artifacts-secondary/*
              # Lambda — update function code (fast path, no CF needed) — both regions
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource:
                  - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:newsletter-*'
                  - !Sub 'arn:aws:lambda:us-east-2:${AWS::AccountId}:function:newsletter-*'
              # CloudFormation — deploy newsletter, api-domain, and secondary stacks
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/micahwalter-newsletter/*'
                  - !Sub 'arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/micahwalter-api-domain/*'
                  - !Sub 'arn:aws:cloudformation:us-east-2:${AWS::AccountId}:stack/micahwalter-newsletter-secondary/*'
                  - !Sub 'arn:aws:cloudformation:us-east-2:${AWS::AccountId}:stack/micahwalter-api-domain-secondary/*'
                  - !Sub 'arn:aws:cloudformation:us-east-2:${AWS::AccountId}:stack/micahwalter-newsletter-bootstrap-secondary/*'
              # ACM — request and manage TLS certificate for api.micahwalter.com
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              # Route53 — DNS validation records for ACM + alias records for API GW custom domain
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:GetChange
                Resource:
                  - !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
                  - 'arn:aws:route53:::change/*'
              # API Gateway — custom domain names, HTTP APIs, routes, integrations, tags, etc.
              # CloudFormation accesses many sub-paths (/apis/*, /domainnames/*, /tags/*, etc.)
              # so we scope to region with a wildcard rather than enumerate all paths.
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:PUT
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::*'
              # IAM — create/update/delete Lambda execution roles in newsletter stack
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/newsletter-*-fn-role'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/newsletter-dispatch-fn-role'
              # Lambda — full lifecycle for newsletter functions and event source mappings (us-east-1)
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource:
                  - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:newsletter-*'
                  - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:event-source-mapping:*'
              # Lambda — full lifecycle for newsletter functions in us-east-2 (secondary)
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource:
                  - !Sub 'arn:aws:lambda:us-east-2:${AWS::AccountId}:function:newsletter-*'
                  - !Sub 'arn:aws:lambda:us-east-2:${AWS::AccountId}:event-source-mapping:*'
              # SQS — manage queues in newsletter stack (us-east-1)
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                  - sqs:AddPermission
                  - sqs:RemovePermission
                Resource:
                  - !Sub 'arn:aws:sqs:us-east-1:${AWS::AccountId}:email-send-queue'
                  - !Sub 'arn:aws:sqs:us-east-1:${AWS::AccountId}:email-send-dlq'
                  - !Sub 'arn:aws:sqs:us-east-1:${AWS::AccountId}:newsletter-dispatch-queue'
                  - !Sub 'arn:aws:sqs:us-east-1:${AWS::AccountId}:newsletter-dispatch-dlq'
              # SQS — manage queues in secondary newsletter stack (us-east-2)
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                  - sqs:AddPermission
                  - sqs:RemovePermission
                Resource:
                  - !Sub 'arn:aws:sqs:us-east-2:${AWS::AccountId}:email-send-queue'
                  - !Sub 'arn:aws:sqs:us-east-2:${AWS::AccountId}:email-send-dlq'
              # SES (v2) — manage email identity in newsletter stacks (both regions)
              - Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:PutEmailIdentityDkimAttributes
                  - ses:PutEmailIdentityMailFromAttributes
                  - ses:TagResource
                  - ses:UntagResource
                Resource:
                  - !Sub 'arn:aws:ses:us-east-1:${AWS::AccountId}:identity/*'
                  - !Sub 'arn:aws:ses:us-east-2:${AWS::AccountId}:identity/*'
              - Effect: Allow
                Action:
                  - ses:CreateConfigurationSet
                  - ses:DeleteConfigurationSet
                  - ses:CreateConfigurationSetEventDestination
                  - ses:DeleteConfigurationSetEventDestination
                  - ses:UpdateConfigurationSetEventDestination
                  - ses:GetConfigurationSet
                  - ses:GetConfigurationSetEventDestinations
                Resource: '*'
              # SES templates — manage email templates in both regions
              - Effect: Allow
                Action:
                  - ses:CreateTemplate
                  - ses:UpdateTemplate
                  - ses:DeleteTemplate
                  - ses:GetTemplate
                Resource: '*'
              # DynamoDB — manage newsletter tables (us-east-1); secondary uses Global Table replica
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                Resource:
                  - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/newsletter_*'
              # EventBridge — manage newsletter event bus and rules (us-east-1)
              - Effect: Allow
                Action:
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:DescribeEventBus
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                  - events:CreateArchive
                  - events:DeleteArchive
                  - events:DescribeArchive
                  - events:UpdateArchive
                Resource:
                  - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:event-bus/newsletter-bus'
                  - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:rule/newsletter-bus/*'
                  - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:archive/newsletter-bus-archive'
              # EventBridge — manage newsletter event bus and rules (us-east-2)
              - Effect: Allow
                Action:
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:DescribeEventBus
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:events:us-east-2:${AWS::AccountId}:event-bus/newsletter-bus'
                  - !Sub 'arn:aws:events:us-east-2:${AWS::AccountId}:rule/newsletter-bus/*'
              # Secrets Manager — manage HMAC secret and replica (us-east-1 primary)
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:RestoreSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:ReplicateSecretToRegions
                  - secretsmanager:RemoveRegionsFromReplication
                Resource:
                  - !Sub 'arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:newsletter-hmac-key*'
              # Secrets Manager — read replica in us-east-2 (for secondary Lambda functions)
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:us-east-2:${AWS::AccountId}:secret:newsletter-hmac-key*'
              # CloudWatch — manage newsletter alarms (us-east-1)
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:newsletter-*'
              # CloudWatch — manage newsletter alarms (us-east-2)
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:cloudwatch:us-east-2:${AWS::AccountId}:alarm:newsletter-*'
              # Route 53 health checks — manage health check for api.micahwalter.com primary
              - Effect: Allow
                Action:
                  - route53:CreateHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:GetHealthCheck
                  - route53:UpdateHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                Resource: '*'
              # ACM — request and manage TLS certificates in both regions
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              # API Gateway — manage domains and APIs in us-east-2 (secondary)
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:PUT
                Resource:
                  - 'arn:aws:apigateway:us-east-2::*'
              # IAM — create/update/delete Lambda execution roles for secondary stack
              # (-secondary suffix roles are used in us-east-2; IAM is global)
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/newsletter-*-fn-role-secondary'
              # Bedrock — invoke Claude models for AI-assisted tooling (e.g. photo tagging)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.*'
              # SNS — manage alarm notification topics
              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:newsletter-*'
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: GitHubActionsDeployment

  # Photo-upload permissions as a managed policy — inline policies on the role
  # were hitting the 10 KB combined limit.
  PhotoUploadDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GitHubActionsDeployPhotoUpload
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub 'arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/micahwalter-photo-upload/*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:PutBucketNotification
              - s3:GetBucketNotification
              - s3:PutBucketCORS
              - s3:GetBucketCORS
              - s3:PutLifecycleConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:GetBucketTagging
            Resource:
              - arn:aws:s3:::micahwalter-photo-uploads
              - arn:aws:s3:::micahwalter-photo-uploads/*
          - Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
              - lambda:PutFunctionEventInvokeConfig
              - lambda:GetFunctionEventInvokeConfig
              - lambda:DeleteFunctionEventInvokeConfig
            Resource:
              - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:photo-upload-*'
          - Effect: Allow
            Action:
              - iam:PassRole
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/photo-upload-*-fn-role'
          - Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeTimeToLive
            Resource:
              - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/micahwalter-photos'
              - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/micahwalter-photos/index/*'
              - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/micahwalter-galleries'
              - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/micahwalter-galleries/index/*'
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:CreateArchive
              - events:DeleteArchive
              - events:DescribeArchive
              - events:UpdateArchive
              - events:ListArchives
            Resource:
              - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:event-bus/photo-bus'
              - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:rule/photo-bus/*'
              - !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:archive/photo-bus-archive'
          - Effect: Allow
            Action:
              - geo:CreatePlaceIndex
              - geo:DeletePlaceIndex
              - geo:DescribePlaceIndex
              - geo:UpdatePlaceIndex
              - geo:TagResource
              - geo:UntagResource
              - geo:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:geo:us-east-1:${AWS::AccountId}:place-index/micahwalter-photos-place-index'
              - !Sub 'arn:aws:geo:us-east-1:${AWS::AccountId}:place-index/*'
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:ListQueueTags
              - sqs:AddPermission
              - sqs:RemovePermission
            Resource:
              - !Sub 'arn:aws:sqs:us-east-1:${AWS::AccountId}:photo-upload-process-dlq'
          - Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:RestoreSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource:
              - !Sub 'arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:photo-upload-secrets*'
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:photo-upload-*'

  TicketsDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GitHubActionsDeployTickets
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
