          - Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
            Resource:
              - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:tickets-*'
              - !Sub 'arn:aws:lambda:us-east-2:${AWS::AccountId}:function:tickets-*'
          - Effect: Allow
            Action:
              - iam:PassRole
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/tickets-*-fn-role'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/tickets-*-fn-role-secondary'
          - Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:RestoreSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:ReplicateSecretToRegions
            Resource:
              - !Sub 'arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:ticket-server-secrets*'
              - !Sub 'arn:aws:secretsmanager:us-east-2:${AWS::AccountId}:secret:ticket-server-secrets*'
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:tickets-*'
              - !Sub 'arn:aws:cloudwatch:us-east-2:${AWS::AccountId}:alarm:tickets-*'
          - Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - 'arn:aws:apigateway:us-east-1::/*'
              - 'arn:aws:apigateway:us-east-2::/*'

  # Website infra (infra.yml / infra-secondary.yml) — used by infra-deploy.yml
  WebsiteInfraDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GitHubActionsDeployWebsiteInfra
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:UpdateStack
              - cloudformation:CreateStack
            Resource:
              - !Sub 'arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/micahwalter-www/*'
              - !Sub 'arn:aws:cloudformation:us-east-2:${AWS::AccountId}:stack/micahwalter-www-secondary/*'
          - Effect: Allow
            Action:
              - cloudfront:DescribeFunction
              - cloudfront:CreateFunction
              - cloudfront:UpdateFunction
              - cloudfront:PublishFunction
              - cloudfront:DeleteFunction
              - cloudfront:ListFunctions
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
              - cloudfront:CreateOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:ListOriginAccessControls
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketAcl
              - s3:PutBucketAcl
              - s3:GetBucketCORS
              - s3:PutBucketCORS
              - s3:GetBucketLogging
              - s3:PutBucketLogging
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetReplicationConfiguration
              - s3:PutReplicationConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketOwnershipControls
              - s3:PutBucketOwnershipControls
              - s3:GetBucketTagging
              - s3:PutBucketTagging
            Resource:
              - arn:aws:s3:::micahwalter-www-*
              - arn:aws:s3:::micahwalter-www-*/*
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:PassRole
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/micahwalter-www-replication-role'

Outputs:
  RoleArn:
    Description: ARN of the IAM role for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: GitHubActionsDeployRoleArn

  OIDCProviderArn:
    Description: ARN of the GitHub OIDC provider
    Value: !GetAtt GitHubOIDCProvider.Arn
