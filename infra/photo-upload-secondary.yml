AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Photo upload/API — secondary region (us-east-2). Active-passive failover
  target for api.micahwalter.com/photos. DynamoDB reads/writes go to the
  primary micahwalter-photos / micahwalter-galleries tables in us-east-1.
  Process/enrich/upload pipeline remain primary-only in U7.

Parameters:

  LambdaArtifactsBucket:
    Type: String
    Default: micahwalter-newsletter-artifacts-secondary
    Description: S3 bucket for secondary Lambda artifacts

  LambdaArtifactsKeyPrefix:
    Type: String
    Default: photo-upload/lambda
    Description: S3 key prefix for photo-upload.zip (no trailing slash)

  SiteUrl:
    Type: String
    Default: https://www.micahwalter.com

  ApiDomainName:
    Type: String
    Default: api.micahwalter.com
    Description: Custom domain managed by infra/api-domain-secondary.yml

  PrimaryRegion:
    Type: String
    Default: us-east-1

  PhotosTableName:
    Type: String
    Default: micahwalter-photos

  GalleriesTableName:
    Type: String
    Default: micahwalter-galleries

  PhotoUploadSecretName:
    Type: String
    Default: photo-upload-secrets
    Description: Secrets Manager secret name (resolves to local replica in us-east-2)

Resources:

  PhotoApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: photo-upload-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteUrl
          - http://localhost:3000
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      Tags:
        Project: micahwalter-photo-upload
        Region: secondary
        ManagedBy: CloudFormation

  PhotoApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - AuthRoute
      - GalleriesListRoute
      - GalleriesCreateRoute
      - GalleriesGetRoute
      - GalleriesPatchRoute
      - PhotosListRoute
      - PhotosFeaturedRoute
      - PhotosGetRoute
      - PhotosPatchRoute
      - PhotosExposureQueueRoute
    Properties:
      ApiId: !Ref PhotoApi
      StageName: $default
      AutoDeploy: true

  PhotoApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref PhotoApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref PhotoApiStage
      ApiMappingKey: photos

  AuthFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-auth-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuthFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PhotoUploadSecretName}*

  PhotosApiFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-photos-api-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PhotosApiFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PhotoUploadSecretName}*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource:
                  - !Sub arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/${PhotosTableName}
                  - !Sub arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/${PhotosTableName}/index/*
                  - !Sub arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/${GalleriesTableName}
                  - !Sub arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/${GalleriesTableName}/index/*

  AuthFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-auth
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/auth.handler
      Role: !GetAtt AuthFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecretName
          TOKEN_TTL: '1800'
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: Region, Value: secondary }

  PhotosApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-photos-api
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/photos-api.handler
      Role: !GetAtt PhotosApiFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecretName
          PHOTOS_TABLE: !Ref PhotosTableName
          GALLERIES_TABLE: !Ref GalleriesTableName
          DYNAMODB_REGION: !Ref PrimaryRegion
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: Region, Value: secondary }

  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  PhotosApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotosApiFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  AuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /auth
      Target: !Sub integrations/${AuthIntegration}

  GalleriesListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /galleries
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /galleries
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /galleries/{slug}
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesPatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: PATCH /galleries/{slug}
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosFeaturedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /featured
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /{id}
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosPatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: PATCH /{id}
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosExposureQueueRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /exposure-queue
      Target: !Sub integrations/${PhotosApiIntegration}

  # Do NOT add $default — see primary photo-upload.yml note (CORS + bare-path 500s).

  AuthFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/*/auth

  PhotosApiFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PhotosApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/*/*

Outputs:

  ApiEndpoint:
    Description: Auto-generated API URL (secondary region)
    Value: !Sub https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com

  ApiRegionalDomainName:
    Description: Regional domain for Route 53 health checks
    Value: !Sub ${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com
