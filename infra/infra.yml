AWSTemplateFormatVersion: '2010-09-09'
Description: 'Static website hosting with S3 and CloudFront - optimized for cost and security'

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for micahwalter.com (find in AWS Console > Route53 > Hosted Zones)

  DomainName:
    Type: String
    Default: micahwalter.com
    Description: Root domain name

  WWWDomainName:
    Type: String
    Default: www.micahwalter.com
    Description: WWW subdomain name

  SecondaryWebsiteBucketName:
    Type: String
    Default: micahwalter-www-secondary-website
    Description: Secondary S3 bucket name for website content (us-east-2, from infra-secondary.yml)

  SecondaryImagesBucketName:
    Type: String
    Default: micahwalter-www-secondary-images
    Description: Secondary S3 bucket name for images (us-east-2, from infra-secondary.yml)

Resources:
  # IAM role used by S3 Cross-Region Replication (CRR) to copy objects to the secondary buckets.
  # Must be created before the buckets that reference it via ReplicationConfiguration.
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-replication-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3CRRPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSourceBuckets
                Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${AWS::StackName}-website'
                  - !Sub 'arn:aws:s3:::${AWS::StackName}-images'
              - Sid: ReadSourceObjects
                Effect: Allow
                Action:
                  - s3:GetObjectVersionForReplication
                  - s3:GetObjectVersionAcl
                  - s3:GetObjectVersionTagging
                Resource:
                  - !Sub 'arn:aws:s3:::${AWS::StackName}-website/*'
                  - !Sub 'arn:aws:s3:::${AWS::StackName}-images/*'
              - Sid: WriteDestinationBuckets
                Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                Resource:
                  - !Sub 'arn:aws:s3:::${SecondaryWebsiteBucketName}/*'
                  - !Sub 'arn:aws:s3:::${SecondaryImagesBucketName}/*'
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: S3CrossRegionReplication

  # S3 Bucket for access logs
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-logs'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: AccessLogs

  # Primary S3 Bucket for website content
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-website'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access-logs/website/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
      # CRR: asynchronously copy every new/updated object to the secondary bucket in us-east-2.
      # Only objects created/modified AFTER this rule is enabled are replicated automatically;
      # run scripts/backfill-secondary.sh once to sync pre-existing objects.
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: ReplicateWebsiteToSecondary
            Status: Enabled
            Priority: 1
            # Filter + Priority required by V2 schema to enable DeleteMarkerReplication
            Filter:
              Prefix: ''
            Destination:
              Bucket: !Sub 'arn:aws:s3:::${SecondaryWebsiteBucketName}'
              StorageClass: STANDARD
            DeleteMarkerReplication:
              Status: Enabled
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: WebsiteContent

  # S3 Bucket for optimized blog post images
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-images'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access-logs/images/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: ReplicateImagesToSecondary
            Status: Enabled
            Priority: 1
            Filter:
              Prefix: ''
            Destination:
              Bucket: !Sub 'arn:aws:s3:::${SecondaryImagesBucketName}'
              StorageClass: STANDARD
            DeleteMarkerReplication:
              Status: Enabled
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: BlogImages

  # ACM Certificate for custom domains (must be in us-east-1 for CloudFront)
  # CloudFormation automatically creates/removes Route53 DNS validation records
  ACMCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref WWWDomainName
      SubjectAlternativeNames:
        - !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref WWWDomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation

  # CloudFront Origin Access Control for Website Bucket
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Origin Access Control for Images Bucket
  CloudFrontImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Origin Access Control for secondary website bucket (us-east-2)
  CloudFrontSecondaryWebsiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-secondary-website-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Origin Access Control for secondary images bucket (us-east-2)
  CloudFrontSecondaryImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-secondary-images-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Function for static HTML routing
  StaticHTMLRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-static-html-routing'
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Skip paths that already include a file extension
          if (uri.indexOf('.') !== -1) {
            return request;
          }

          if (uri !== '/' && uri.endsWith('/')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: uri.slice(0, -1) }
              }
            };
          }

          // Photo ids moved to /photos/<id>: permanent redirect from /posts/<digits>
          var photoPostRedirect = getPhotoPostRedirect(uri);
          if (photoPostRedirect) {
            return photoPostRedirect;
          }

          // Legacy post URL patterns -> /posts/[slug] (replaces ~1,150 Next.js redirect pages)
          var legacyRedirect = getLegacyPostRedirect(uri);
          if (legacyRedirect) {
            return legacyRedirect;
          }

          // Share crawlers get pre-rendered OG HTML (photos/exposures/galleries are SPA shells)
          var ogUri = rewriteShareCrawler(uri, request);
          if (ogUri) {
            request.uri = ogUri;
            return request;
          }

          // Static-export shell: serve /photos/0.html for any /photos/<digits>
          // (browser URL unchanged; client reads id from pathname)
          var photoShell = rewritePhotoDetailShell(uri);
          if (photoShell) {
            request.uri = photoShell;
            return request;
          }

          // Static-export shell for API galleries: /galleries/<slug> → placeholder
          var galleryShell = rewriteGalleryDetailShell(uri);
          if (galleryShell) {
            request.uri = galleryShell;
            return request;
          }

          // Static-export shell for Exposure issues: /exposures/<digits> → 0.html
          var exposureShell = rewriteExposureDetailShell(uri);
          if (exposureShell) {
            request.uri = exposureShell;
            return request;
          }

          if (uri === '/' || uri === '') {
            request.uri = '/index.html';
          } else {
            request.uri = uri + '.html';
          }

          return request;
        }

        function isAllDigits(s) {
          if (!s || s.length === 0) return false;
          for (var i = 0; i < s.length; i++) {
            var c = s.charAt(i);
            if (c < '0' || c > '9') return false;
          }
          return true;
        }

        function isShareCrawler(request) {
          var h = request.headers['user-agent'];
          if (!h || !h.value) return false;
          var ua = h.value.toLowerCase();
          return (
            ua.indexOf('linkedinbot') !== -1 ||
            ua.indexOf('twitterbot') !== -1 ||
            ua.indexOf('facebookexternalhit') !== -1 ||
            ua.indexOf('facebot') !== -1 ||
            ua.indexOf('slackbot') !== -1 ||
            ua.indexOf('discordbot') !== -1 ||
            ua.indexOf('whatsapp') !== -1 ||
            ua.indexOf('telegrambot') !== -1 ||
            ua.indexOf('applebot') !== -1 ||
            ua.indexOf('pinterest') !== -1 ||
            ua.indexOf('embedly') !== -1 ||
            ua.indexOf('redditbot') !== -1 ||
            ua.indexOf('skypeuripreview') !== -1 ||
            ua.indexOf('vkshare') !== -1 ||
            ua.indexOf('iframely') !== -1 ||
            ua.indexOf('googlebot') !== -1 ||
            ua.indexOf('bingbot') !== -1 ||
            ua.indexOf('yandex') !== -1 ||
            ua.indexOf('duckduckbot') !== -1 ||
            ua.indexOf('baiduspider') !== -1 ||
            ua.indexOf('opengraph') !== -1
          );
        }

        function rewriteShareCrawler(uri, request) {
          if (!isShareCrawler(request)) return null;
          var path = uri;
          if (path.charAt(0) === '/') path = path.slice(1);
          if (path.endsWith('/')) path = path.slice(0, -1);
          if (path === '') return '/og/home.html';
          var parts = path.split('/');
          if (parts.length === 1) {
            if (parts[0] === 'photos') return '/og/photos.html';
            if (parts[0] === 'exposures') return '/og/exposures.html';
            if (parts[0] === 'galleries') return '/og/galleries.html';
            return null;
          }
          if (parts.length === 2 && parts[0] === 'photos' && isAllDigits(parts[1])) {
            return '/og/photos/' + parts[1] + '.html';
          }
          if (parts.length === 2 && parts[0] === 'exposures' && isAllDigits(parts[1])) {
            return '/og/exposures/' + parts[1] + '.html';
          }
          if (parts.length === 2 && parts[0] === 'galleries' && parts[1] && parts[1] !== '_placeholder') {
            return '/og/galleries/' + parts[1] + '.html';
          }
          return null;
        }

        function getPhotoPostRedirect(uri) {
          var path = uri;
          if (path.charAt(0) === '/') {
            path = path.slice(1);
          }
          if (path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          var parts = path.split('/');
          if (parts.length === 2 && parts[0] === 'posts' && isAllDigits(parts[1])) {
            return redirect301('/photos/' + parts[1]);
          }
          return null;
        }

        function rewritePhotoDetailShell(uri) {
          var path = uri;
          if (path.charAt(0) === '/') {
            path = path.slice(1);
          }
          if (path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          var parts = path.split('/');
          if (parts.length === 2 && parts[0] === 'photos' && isAllDigits(parts[1])) {
            return '/photos/0.html';
          }
          return null;
        }

        function rewriteGalleryDetailShell(uri) {
          var path = uri;
          if (path.charAt(0) === '/') {
            path = path.slice(1);
          }
          if (path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          var parts = path.split('/');
          if (
            parts.length === 2 &&
            parts[0] === 'galleries' &&
            parts[1] &&
            parts[1] !== '_placeholder'
          ) {
            return '/galleries/_placeholder.html';
          }
          return null;
        }

        function rewriteExposureDetailShell(uri) {
          var path = uri;
          if (path.charAt(0) === '/') {
            path = path.slice(1);
          }
          if (path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          var parts = path.split('/');
          if (parts.length === 2 && parts[0] === 'exposures' && isAllDigits(parts[1])) {
            return '/exposures/0.html';
          }
          return null;
        }

        function isValidMonth(month) {
          if (month.length !== 2) return false;
          var n = parseInt(month, 10);
          if (n < 1 || n > 12) return false;
          for (var i = 0; i < month.length; i++) {
            var c = month.charAt(i);
            if (c < '0' || c > '9') return false;
          }
          return true;
        }

        function isFourDigitYear(s) {
          if (s.length !== 4) return false;
          for (var i = 0; i < 4; i++) {
            var c = s.charAt(i);
            if (c < '0' || c > '9') return false;
          }
          return true;
        }

        function isTwoDigit(s) {
          if (s.length !== 2) return false;
          for (var i = 0; i < 2; i++) {
            var c = s.charAt(i);
            if (c < '0' || c > '9') return false;
          }
          return true;
        }

        function isReservedSegment(seg) {
          var reserved = {
            'about': 1, 'colophon': 1, 'emails': 1, 'exposures': 1, 'galleries': 1,
            'micro': 1, 'newsletter': 1, 'og': 1, 'photos': 1, 'posts': 1,
            'sketches': 1, 'tokens': 1, 'upload': 1, 'tags': 1, 'topics': 1, 'page': 1
          };
          return reserved[seg] === 1;
        }

        function redirect301(path) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: path }
            }
          };
        }

        function getLegacyPostRedirect(uri) {
          var path = uri;
          if (path.charAt(0) === '/') {
            path = path.slice(1);
          }
          if (path === '') {
            return null;
          }

          var parts = path.split('/');
          var n = parts.length;

          // /YYYY/MM/DD/slug
          if (n === 4 && isFourDigitYear(parts[0]) && isValidMonth(parts[1]) && isTwoDigit(parts[2])) {
            return redirect301('/posts/' + parts[3]);
          }

          // /YYYY/MM/slug
          if (n === 3 && isFourDigitYear(parts[0]) && isValidMonth(parts[1])) {
            return redirect301('/posts/' + parts[2]);
          }

          // /YYYY/slug
          if (n === 2 && isFourDigitYear(parts[0]) && !isValidMonth(parts[1])) {
            return redirect301('/posts/' + parts[1]);
          }

          // /slug (legacy slug-as-year URLs; exclude static top-level routes)
          if (n === 1 && !isFourDigitYear(parts[0]) && !isReservedSegment(parts[0])) {
            return redirect301('/posts/' + parts[0]);
          }

          return null;
        }
      FunctionConfig:
        Comment: Legacy post redirects, clean URL HTML routing, share-crawler OG HTML, trailing-slash redirects
        Runtime: cloudfront-js-1.0

  # CloudFront Function for apex domain redirect to www
  ApexRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-apex-redirect'
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://${WWWDomainName}' + event.request.uri }
            }
          };
        }
      FunctionConfig:
        Comment: Redirects all apex domain requests to www
        Runtime: cloudfront-js-1.0

  # Main CloudFront Distribution (www.micahwalter.com)
  # Uses origin groups for automatic per-request failover to us-east-2 secondary buckets.
  # On a 403/5xx from the primary origin, CloudFront immediately retries the secondary.
  # No DNS changes or manual intervention required during a regional S3 outage.
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'Distribution for ${AWS::StackName}'
        DefaultRootObject: index.html
        Aliases:
          - !Ref WWWDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # Primary website bucket (us-east-1)
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
          # Primary images bucket (us-east-1)
          - Id: ImagesOrigin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontImagesOAC
          # Secondary website bucket (us-east-2) — failover target
          - Id: S3OriginSecondary
            DomainName: !Sub '${SecondaryWebsiteBucketName}.s3.us-east-2.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontSecondaryWebsiteOAC
          # Secondary images bucket (us-east-2) — failover target
          - Id: ImagesOriginSecondary
            DomainName: !Sub '${SecondaryImagesBucketName}.s3.us-east-2.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontSecondaryImagesOAC
        # Origin groups enable automatic per-request failover.
        # 403: S3 can return this during bucket-level access failures (not just "file not found").
        # 5xx: covers connection timeouts and service errors.
        # 404 is intentionally excluded — a missing page on primary is a real 404, not a failure.
        OriginGroups:
          Quantity: 2
          Items:
            - Id: WebsiteOriginGroup
              FailoverCriteria:
                StatusCodes:
                  Quantity: 5
                  Items: [403, 500, 502, 503, 504]
              Members:
                Quantity: 2
                Items:
                  - OriginId: S3Origin
                  - OriginId: S3OriginSecondary
            - Id: ImagesOriginGroup
              FailoverCriteria:
                StatusCodes:
                  Quantity: 5
                  Items: [403, 500, 502, 503, 504]
              Members:
                Quantity: 2
                Items:
                  - OriginId: ImagesOrigin
                  - OriginId: ImagesOriginSecondary
        CacheBehaviors:
          # Cache behavior for optimized blog post images — uses images origin group
          - PathPattern: '/images/*'
            TargetOriginId: ImagesOriginGroup
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        DefaultCacheBehavior:
          TargetOriginId: WebsiteOriginGroup
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt StaticHTMLRoutingFunction.FunctionARN
        # Custom error responses apply after both origins in a group have been tried.
        # 403 and 404 from S3 (with OAC) both map to the themed 404 page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
        PriceClass: PriceClass_All
        Logging:
          Bucket: !GetAtt LogsBucket.DomainName
          Prefix: cloudfront-logs/
          IncludeCookies: false
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: MainDistribution

  # Apex redirect CloudFront Distribution (micahwalter.com → www.micahwalter.com)
  # The CloudFront Function returns a 301 redirect on every request; the origin is never hit.
  ApexRedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'Apex redirect for ${DomainName} -> ${WWWDomainName}'
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # Dummy origin — never reached because the function always returns a redirect
          - Id: DummyOrigin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: DummyOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ApexRedirectFunction.FunctionARN
        PriceClass: PriceClass_All
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: ApexRedirect

  # Bucket Policy for Website Bucket
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Bucket Policy for Images Bucket
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Route53 DNS records
  DNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        # www.micahwalter.com → main distribution (IPv4)
        - Name: !Ref WWWDomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (constant)
        # www.micahwalter.com → main distribution (IPv6)
        - Name: !Ref WWWDomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        # micahwalter.com → apex redirect distribution (IPv4)
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApexRedirectDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        # micahwalter.com → apex redirect distribution (IPv6)
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt ApexRedirectDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontURL:
    Description: CloudFront Distribution URL - use this to access your website
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  WebsiteURL:
    Description: Primary website URL
    Value: !Sub 'https://${WWWDomainName}'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (needed for cache invalidation)
    Value: !Ref CloudFrontDistribution

  WebsiteBucketName:
    Description: S3 Bucket Name for website content
    Value: !Ref WebsiteBucket

  ImagesBucketName:
    Description: S3 Bucket Name for optimized blog post images
    Value: !Ref ImagesBucket

  LogsBucketName:
    Description: S3 Bucket Name for access logs
    Value: !Ref LogsBucket

  DeployCommand:
    Description: Example AWS CLI command to sync your website files
    Value: !Sub 'aws s3 sync ./dist s3://${WebsiteBucket}/ --delete'

  UploadImagesCommand:
    Description: Example AWS CLI command to upload optimized images
    Value: !Sub 'aws s3 sync .optimized-images/posts s3://${ImagesBucket}/images/posts/ --cache-control "public, max-age=31536000, immutable"'

  InvalidateCacheCommand:
    Description: Example AWS CLI command to invalidate CloudFront cache after deployment
    Value: !Sub 'aws cloudfront create-invalidation --distribution-id ${CloudFrontDistribution} --paths "/*"'
