AWSTemplateFormatVersion: '2010-09-09'
Description: 'Static website hosting with S3 and CloudFront - optimized for cost and security'

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for micahwalter.com (find in AWS Console > Route53 > Hosted Zones)

  DomainName:
    Type: String
    Default: micahwalter.com
    Description: Root domain name

  WWWDomainName:
    Type: String
    Default: www.micahwalter.com
    Description: WWW subdomain name

Resources:
  # S3 Bucket for access logs
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-logs'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: AccessLogs

  # Primary S3 Bucket for website content
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-website'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access-logs/website/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: WebsiteContent

  # S3 Bucket for optimized blog post images
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-images'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access-logs/images/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: BlogImages

  # ACM Certificate for custom domains (must be in us-east-1 for CloudFront)
  # CloudFormation automatically creates/removes Route53 DNS validation records
  ACMCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref WWWDomainName
      SubjectAlternativeNames:
        - !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref WWWDomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: ManagedBy
          Value: CloudFormation

  # CloudFront Origin Access Control for Website Bucket
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Origin Access Control for Images Bucket
  CloudFrontImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Function for static HTML routing
  StaticHTMLRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-static-html-routing'
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Routes that should serve static HTML files
          var staticRoutes = ['/posts/', '/topics/', '/sketches', '/photos/', '/tags/'];
          var isStaticRoute = staticRoutes.some(function(route) {
            return uri.startsWith(route);
          });

          // If URI doesn't have a file extension
          if (!uri.includes('.')) {
            if (uri === '/' || uri === '') {
              // Root path serves index.html
              request.uri = '/index.html';
            } else if (uri.endsWith('/')) {
              // Directory paths get index.html appended
              request.uri = uri + 'index.html';
            } else if (isStaticRoute) {
              // Static routes get .html appended for clean URLs
              request.uri = uri + '.html';
            } else {
              // Other routes fall back to index.html for client-side routing
              request.uri = '/index.html';
            }
          }

          return request;
        }
      FunctionConfig:
        Comment: Routes paths to static HTML files with clean URLs or falls back to SPA routing
        Runtime: cloudfront-js-1.0

  # CloudFront Function for apex domain redirect to www
  ApexRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-apex-redirect'
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://${WWWDomainName}' + event.request.uri }
            }
          };
        }
      FunctionConfig:
        Comment: Redirects all apex domain requests to www
        Runtime: cloudfront-js-1.0

  # Main CloudFront Distribution (www.micahwalter.com)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'Distribution for ${AWS::StackName}'
        DefaultRootObject: index.html
        Aliases:
          - !Ref WWWDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
          - Id: ImagesOrigin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontImagesOAC
        CacheBehaviors:
          # Cache behavior for optimized blog post images
          - PathPattern: '/images/*'
            TargetOriginId: ImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt StaticHTMLRoutingFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        PriceClass: PriceClass_All
        Logging:
          Bucket: !GetAtt LogsBucket.DomainName
          Prefix: cloudfront-logs/
          IncludeCookies: false
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation

  # Apex redirect CloudFront Distribution (micahwalter.com → www.micahwalter.com)
  # The CloudFront Function returns a 301 redirect on every request; the origin is never hit.
  ApexRedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'Apex redirect for ${DomainName} -> ${WWWDomainName}'
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # Dummy origin — never reached because the function always returns a redirect
          - Id: DummyOrigin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: DummyOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ApexRedirectFunction.FunctionARN
        PriceClass: PriceClass_All
      Tags:
        - Key: Project
          Value: micahwalter-www
        - Key: Environment
          Value: Production
        - Key: Application
          Value: StaticWebsite
        - Key: ManagedBy
          Value: CloudFormation

  # Bucket Policy for Website Bucket
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Bucket Policy for Images Bucket
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Route53 DNS records
  DNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        # www.micahwalter.com → main distribution (IPv4)
        - Name: !Ref WWWDomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (constant)
        # www.micahwalter.com → main distribution (IPv6)
        - Name: !Ref WWWDomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        # micahwalter.com → apex redirect distribution (IPv4)
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApexRedirectDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        # micahwalter.com → apex redirect distribution (IPv6)
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt ApexRedirectDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontURL:
    Description: CloudFront Distribution URL - use this to access your website
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  WebsiteURL:
    Description: Primary website URL
    Value: !Sub 'https://${WWWDomainName}'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (needed for cache invalidation)
    Value: !Ref CloudFrontDistribution

  WebsiteBucketName:
    Description: S3 Bucket Name for website content
    Value: !Ref WebsiteBucket

  ImagesBucketName:
    Description: S3 Bucket Name for optimized blog post images
    Value: !Ref ImagesBucket

  LogsBucketName:
    Description: S3 Bucket Name for access logs
    Value: !Ref LogsBucket

  DeployCommand:
    Description: Example AWS CLI command to sync your website files
    Value: !Sub 'aws s3 sync ./dist s3://${WebsiteBucket}/ --delete'

  UploadImagesCommand:
    Description: Example AWS CLI command to upload optimized images
    Value: !Sub 'aws s3 sync .optimized-images/posts s3://${ImagesBucket}/images/posts/ --cache-control "public, max-age=31536000, immutable"'

  InvalidateCacheCommand:
    Description: Example AWS CLI command to invalidate CloudFront cache after deployment
    Value: !Sub 'aws cloudfront create-invalidation --distribution-id ${CloudFrontDistribution} --paths "/*"'
