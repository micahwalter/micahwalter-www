      Dimensions:
        - Name: FunctionName
          Value: !Ref UnsubscribeFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EmailFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-email-fn-errors
      AlarmDescription: newsletter-email Lambda error rate is elevated
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
