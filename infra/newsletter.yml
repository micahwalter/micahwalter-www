  # -------------------------------------------------------------------------
  # CloudWatch Alarms
  # -------------------------------------------------------------------------

  SubscribeFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-subscribe-fn-errors
      AlarmDescription: newsletter-subscribe Lambda error rate is elevated
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubscribeFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ConfirmFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-confirm-fn-errors
      AlarmDescription: newsletter-confirm Lambda error rate is elevated
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConfirmFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UnsubscribeFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-unsubscribe-fn-errors
      AlarmDescription: newsletter-unsubscribe Lambda error rate is elevated
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
