AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Newsletter subscription system — secondary region (us-east-2).
  Provides subscribe / confirm / unsubscribe / email / formtoken / health Lambdas,
  API Gateway, SQS, EventBridge, SES, and CloudWatch alarms.

  This stack is the active-passive failover target for the primary (us-east-1) stack.
  It does NOT include the dispatch pipeline (bulk newsletter sending), which remains
  in the primary region and degrades gracefully during a regional outage.

  Prerequisites before first deploy:
    1. infra/newsletter-bootstrap-secondary.yml deployed (creates S3 artifacts bucket)
    2. Lambda zips uploaded to micahwalter-newsletter-artifacts-secondary
    3. infra/api-domain-secondary.yml deployed (creates api.micahwalter.com domain in us-east-2)
    4. newsletter_subscribers DynamoDB Global Table replica exists in us-east-2
       (enabled by StreamSpecification in newsletter.yml + one-time CLI command)
    5. newsletter-hmac-key Secrets Manager replica exists in us-east-2
       (enabled by ReplicaRegions in newsletter.yml)

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  LambdaArtifactsBucket:
    Type: String
    Default: micahwalter-newsletter-artifacts-secondary
    Description: S3 bucket created by newsletter-bootstrap-secondary.yml

  LambdaArtifactsKeyPrefix:
    Type: String
    Default: newsletter/lambda
    Description: S3 key prefix where Lambda zip files are uploaded (no trailing slash)

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone ID for micahwalter.com

  MailFromSubdomain:
    Type: String
    Default: bounce
    Description: Subdomain for SES custom MAIL FROM (must match primary stack)

  DomainName:
    Type: String
    Default: micahwalter.com

  SiteUrl:
    Type: String
    Default: https://www.micahwalter.com
    Description: Full site URL used to build confirmation and unsubscribe links

  SenderEmail:
    Type: String
    Default: micah@micahwalter.com
    Description: From address for all newsletter emails (must be SES-verified in this region)

  AdminEmail:
    Type: String
    Default: micah@micahwalter.com
    Description: Email address to notify when a new subscriber confirms their subscription

  ApiDomainName:
    Type: String
    Default: api.micahwalter.com
    Description: >
      Custom domain managed by infra/api-domain-secondary.yml.
      The ApiMapping binds the newsletter API to this domain.

  # The table name is the same as primary — this stack reads the Global Table replica.
  SubscribersTableName:
    Type: String
    Default: newsletter_subscribers
    Description: >
      DynamoDB table name for the newsletter_subscribers Global Table.
      The replica in us-east-2 has the same name as the primary table.

  # The HMAC secret is referenced by name so the SDK resolves the local replica.
  HMACSecretName:
    Type: String
    Default: newsletter-hmac-key
    Description: >
      Name of the Secrets Manager secret for HMAC signing keys.
      The SDK resolves this to the us-east-2 replica automatically.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # Messaging — EventBridge bus, SQS queue, routing rule
  # (mirrors primary; handles transactional email delivery during failover)
  # -------------------------------------------------------------------------

  NewsletterBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: newsletter-bus
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  EmailSendDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: email-send-dlq
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  EmailSendQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: email-send-queue
      VisibilityTimeout: 30  # >= 6x Lambda timeout (5s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailSendDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  EmailSendQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EmailSendQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EmailSendQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt RouteToEmailRule.Arn

  RouteToEmailRule:
    Type: AWS::Events::Rule
    Properties:
      Name: route-to-email
      EventBusName: !Ref NewsletterBus
      State: ENABLED
      EventPattern:
        source:
          - newsletter.subscribers
        detail-type:
          - SignupRequested
          - ConfirmationResent
          - SubscriberConfirmed
          - UnsubscribeRequested
      Targets:
        - Id: email-send-queue
          Arn: !GetAtt EmailSendQueue.Arn
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  # -------------------------------------------------------------------------
  # API Gateway — HTTP API with CORS
  # -------------------------------------------------------------------------

  NewsletterApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: newsletter-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteUrl
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        ExposeHeaders:
          - X-Newsletter-Queued
        MaxAge: 300
      Tags:
        Project: micahwalter-newsletter
        Environment: Production
        Application: NewsletterSubscription
        ManagedBy: CloudFormation
        Region: secondary

  NewsletterApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NewsletterApi
      StageName: $default
      AutoDeploy: true
      Tags:
        Project: micahwalter-newsletter
        Environment: Production
        Application: NewsletterSubscription
        ManagedBy: CloudFormation
        Region: secondary

  # Binds this API to api.micahwalter.com in us-east-2 (managed by api-domain-secondary.yml)
  NewsletterApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref NewsletterApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref NewsletterApiStage
      ApiMappingKey: newsletter

  # -------------------------------------------------------------------------
  # IAM Roles — one per Lambda, least-privilege.
  # Names use -secondary suffix because IAM roles are globally scoped.
  # Lambda function names can be identical to primary (Lambda is region-scoped).
  # -------------------------------------------------------------------------

  SubscribeFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-subscribe-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SubscribeFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscribersTableName}
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt NewsletterBus.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${HMACSecretName}-*
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Newsletter/Subscribe
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  ConfirmFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-confirm-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConfirmFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscribersTableName}
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt NewsletterBus.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${HMACSecretName}-*
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  UnsubscribeFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-unsubscribe-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UnsubscribeFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscribersTableName}
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt NewsletterBus.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${HMACSecretName}-*
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  EmailFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-email-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmailFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt EmailSendQueue.Arn
              - Effect: Allow
                Action:
                  - ses:SendTemplatedEmail
                  - ses:SendEmail
                Resource: '*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${HMACSecretName}-*
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  FormTokenFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-formtoken-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FormTokenFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${HMACSecretName}-*
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  HealthFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: newsletter-health-fn-role-secondary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  # -------------------------------------------------------------------------
  # Lambda Functions
  # Function names are identical to primary — Lambda is region-scoped.
  # -------------------------------------------------------------------------

  SubscribeFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-subscribe
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt SubscribeFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/subscribe.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref SubscribersTableName
          EVENT_BUS_NAME: !Ref NewsletterBus
          HMAC_SECRET_ARN: !Ref HMACSecretName
          SITE_URL: !Ref SiteUrl
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  ConfirmFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-confirm
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt ConfirmFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/confirm.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref SubscribersTableName
          EVENT_BUS_NAME: !Ref NewsletterBus
          HMAC_SECRET_ARN: !Ref HMACSecretName
          SITE_URL: !Ref SiteUrl
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  UnsubscribeFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-unsubscribe
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt UnsubscribeFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/unsubscribe.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref SubscribersTableName
          EVENT_BUS_NAME: !Ref NewsletterBus
          HMAC_SECRET_ARN: !Ref HMACSecretName
          SITE_URL: !Ref SiteUrl
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  EmailFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-email
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt EmailFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/email.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          SITE_URL: !Ref SiteUrl
          ADMIN_EMAIL: !Ref AdminEmail
          CONFIGURATION_SET_NAME: !Ref NewsletterConfigurationSet
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  FormTokenFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-formtoken
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt FormTokenFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/formtoken.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          HMAC_SECRET_ARN: !Ref HMACSecretName
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  HealthFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsletter-health
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt HealthFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/health.zip
      Timeout: 5
      MemorySize: 128
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  # -------------------------------------------------------------------------
  # API Gateway — integrations, routes, and Lambda invoke permissions
  # -------------------------------------------------------------------------

  SubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NewsletterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubscribeFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  ConfirmIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NewsletterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConfirmFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  UnsubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NewsletterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UnsubscribeFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  FormTokenIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NewsletterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormTokenFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  HealthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NewsletterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NewsletterApi
      RouteKey: POST /subscribe
      Target: !Sub integrations/${SubscribeIntegration}

  ConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NewsletterApi
      RouteKey: POST /confirm
      Target: !Sub integrations/${ConfirmIntegration}

  UnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NewsletterApi
      RouteKey: POST /unsubscribe
      Target: !Sub integrations/${UnsubscribeIntegration}

  FormTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NewsletterApi
      RouteKey: GET /formtoken
      Target: !Sub integrations/${FormTokenIntegration}

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NewsletterApi
      RouteKey: GET /health
      Target: !Sub integrations/${HealthIntegration}

  SubscribeFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubscribeFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NewsletterApi}/*/*/subscribe

  ConfirmFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConfirmFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NewsletterApi}/*/*/confirm

  UnsubscribeFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UnsubscribeFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NewsletterApi}/*/*/unsubscribe

  FormTokenFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FormTokenFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NewsletterApi}/*/*/formtoken

  HealthFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NewsletterApi}/*/*/health

  # -------------------------------------------------------------------------
  # SQS → email-fn event source mapping
  # -------------------------------------------------------------------------

  EmailFnSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt EmailSendQueue.Arn
      FunctionName: !GetAtt EmailFn.Arn
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # -------------------------------------------------------------------------
  # SES — configuration set, domain identity, DKIM DNS records for us-east-2.
  # MAIL FROM and DMARC DNS records are managed by the primary stack (Route 53
  # is global). This stack configures the regional SES identity to match.
  # -------------------------------------------------------------------------

  NewsletterConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: newsletter

  NewsletterConfigurationSetEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref NewsletterConfigurationSet
      EventDestination:
        Name: cloudwatch
        Enabled: true
        MatchingEventTypes:
          - send
          - reject
          - bounce
          - complaint
          - delivery
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: messageType
              DimensionValueSource: messageTag
              DefaultDimensionValue: newsletter

  SESEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      FeedbackAttributes:
        EmailForwardingEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub '${MailFromSubdomain}.${DomainName}'
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary

  DkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESEmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SESEmailIdentity.DkimDNSTokenValue1

  DkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESEmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SESEmailIdentity.DkimDNSTokenValue2

  DkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SESEmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SESEmailIdentity.DkimDNSTokenValue3

  # -------------------------------------------------------------------------
  # SES Email Templates — must exist in us-east-2 for the email Lambda to use.
  # Content is identical to the primary region templates.
  # -------------------------------------------------------------------------

  ConfirmationEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: newsletter-confirmation
        SubjectPart: "Please confirm your subscription"
        TextPart: |
          Hi {{name}},

          Thanks for signing up. Click the link below to confirm your subscription:

          {{confirmation_link}}

          This link expires in 24 hours. If you didn't sign up, you can safely ignore this email.

          — Micah
        HtmlPart: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Confirm your subscription</title>
            <style>
              body { margin: 0; padding: 0; background: #fafaf2; font-family: Georgia, 'Times New Roman', serif; color: #191919; }
              .wrap { max-width: 560px; margin: 48px auto; padding: 0 24px; }
              h1 { font-size: 1.4em; font-weight: normal; margin-bottom: 1.2em; }
              p { line-height: 1.7; margin-bottom: 1.2em; }
              .btn { display: inline-block; background: #191919; color: #fafaf2 !important; text-decoration: none; padding: 12px 28px; font-family: system-ui, sans-serif; font-size: 0.9em; letter-spacing: 0.04em; }
              .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #d0d0c8; font-size: 0.8em; color: #5f5f5f; font-family: system-ui, sans-serif; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>Confirm your subscription</h1>
              <p>Hi {{name}},</p>
              <p>Thanks for signing up. Click the button below to confirm your subscription to Micah Walter's newsletter.</p>
              <p><a class="btn" href="{{confirmation_link}}">Confirm subscription</a></p>
              <p>Or copy this link into your browser:<br>{{confirmation_link}}</p>
              <p>This link expires in 24 hours. If you didn't sign up, you can safely ignore this email.</p>
              <div class="footer">micahwalter.com</div>
            </div>
          </body>
          </html>

