  # -------------------------------------------------------------------------
  # CloudWatch Alarms
  # -------------------------------------------------------------------------

  SubscribeFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-subscribe-fn-errors
      AlarmDescription: newsletter-subscribe Lambda error rate is elevated (secondary region)
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubscribeFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ConfirmFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-confirm-fn-errors
      AlarmDescription: newsletter-confirm Lambda error rate is elevated (secondary region)
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConfirmFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UnsubscribeFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-unsubscribe-fn-errors
      AlarmDescription: newsletter-unsubscribe Lambda error rate is elevated (secondary region)
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UnsubscribeFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EmailFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-email-fn-errors
      AlarmDescription: newsletter-email Lambda error rate is elevated (secondary region)
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EmailSendDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: newsletter-email-send-dlq-depth
      AlarmDescription: >
        Messages are landing in the email DLQ — emails are failing to send (secondary region).
        Check newsletter-email Lambda logs.
      Tags:
        - Key: Project
          Value: micahwalter-newsletter
        - Key: Environment
          Value: Production
        - Key: Application
          Value: NewsletterSubscription
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Region
          Value: secondary
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmailSendDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  ApiEndpoint:
    Description: >
      Auto-generated API Gateway URL (secondary region).
      Prefer https://api.micahwalter.com which Route 53 routes here during failover.
    Value: !Sub https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com

  ApiRegionalDomainName:
    Description: Raw API Gateway regional domain name (for reference / debugging)
    Value: !Sub ${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com

  BusName:
    Description: EventBridge bus name (secondary region)
    Value: !Ref NewsletterBus
