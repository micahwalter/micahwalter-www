    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: newsletter-welcome
        SubjectPart: "You're subscribed"
        TextPart: |
          Hi {{name}},

          You're now subscribed to Micah Walter's newsletter. I'll send occasional updates about writing, photography, and technology.

          To unsubscribe at any time, visit:
          {{unsubscribe_link}}

          — Micah
