AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Web-based photo upload — uploads S3 bucket, Secrets Manager secret, API
  Gateway (HTTP) with auth, presign, and photos CRUD routes, DynamoDB photo
  metadata, EventBridge enrichment bus, and a processing Lambda that resizes,
  extracts EXIF, and writes DynamoDB (no GitHub markdown commit).
  Reuses the newsletter artifacts bucket for Lambda zips.

Parameters:

  LambdaArtifactsBucket:
    Type: String
    Default: micahwalter-newsletter-artifacts
    Description: S3 bucket holding the Lambda zip (reuses the newsletter artifacts bucket)

  LambdaArtifactsKeyPrefix:
    Type: String
    Default: photo-upload/lambda
    Description: S3 key prefix where the photo-upload zip is uploaded (no trailing slash)

  SiteUrl:
    Type: String
    Default: https://www.micahwalter.com
    Description: Allowed CORS origin for the API and the uploads bucket

  ApiDomainName:
    Type: String
    Default: api.micahwalter.com
    Description: Shared API Gateway custom domain (managed by infra/api-domain.yml)

  UploadsBucketName:
    Type: String
    Default: micahwalter-photo-uploads
    Description: Name for the (private) bucket that receives browser uploads

  ImagesBucketName:
    Type: String
    Default: micahwalter-www-images
    Description: Existing images bucket where processed images + originals are written

  PhotosTableName:
    Type: String
    Default: micahwalter-photos
    Description: DynamoDB table for photo metadata

  GalleriesTableName:
    Type: String
    Default: micahwalter-galleries
    Description: DynamoDB table for gallery definitions

  ExposuresTableName:
    Type: String
    Default: micahwalter-exposures
    Description: DynamoDB table for Exposure newsletter archive issues

  ExposureCounterTableName:
    Type: String
    Default: micahwalter-exposure-counter
    Description: DynamoDB table for Exposure issue counter and daily run locks

  WebsiteBucketName:
    Type: String
    Default: micahwalter-www-website
    Description: Primary website bucket for scheduled photo feed/sitemap artifacts

  AdminEmail:
    Type: String
    Default: micah@micahwalter.com
    Description: >
      Owner address for Exposure test sends and (U3) empty-pool notify.
      Keep in sync with newsletter stack AdminEmail.

  NewsletterEventBusName:
    Type: String
    Default: newsletter-bus
    Description: EventBridge bus that routes NewsletterSendRequested to dispatch

Resources:

  UploadsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessFnPermission
    Properties:
      BucketName: !Ref UploadsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref SiteUrl
              - http://localhost:3000
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: expire-incoming
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/incoming/
            Function: !GetAtt ProcessFn.Arn
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  PhotoUploadSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: photo-upload-secrets
      Description: >
        Photo upload secrets. Populate manually after first deploy:
        {"passcode":"<upload passcode>","hmac":"<random signing key>","ticketsPasscode":"<ticket server passcode>"}
        (githubToken no longer used by process Lambda)
      ReplicaRegions:
        - Region: us-east-2
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PhotosTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  GalleriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref GalleriesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: slug, AttributeType: S }
      KeySchema:
        - { AttributeName: slug, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  ExposuresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ExposuresTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: issueNumber, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: issueNumber, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  PhotoEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: photo-bus

  ProcessDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: photo-upload-process-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  PhotoApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: photo-upload-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteUrl
          - http://localhost:3000
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      Tags:
        Project: micahwalter-photo-upload
        ManagedBy: CloudFormation

  PhotoApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - AuthRoute
      - InitRoute
      - GalleriesListRoute
      - GalleriesCreateRoute
      - GalleriesGetRoute
      - GalleriesPatchRoute
      - PhotosListRoute
      - PhotosFeaturedRoute
      - PhotosGetRoute
      - PhotosPatchRoute
      - PhotosExposureTestRoute
    Properties:
      ApiId: !Ref PhotoApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      RouteSettings:
        'POST /auth':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1

  PhotoApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref PhotoApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref PhotoApiStage
      ApiMappingKey: photos

  AuthFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-auth-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuthFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PhotoUploadSecret

  InitFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-init-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InitFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PhotoUploadSecret
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${UploadsBucketName}/uploads/incoming/*

  ProcessFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-process-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProcessFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${UploadsBucketName}/uploads/incoming/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ImagesBucketName}/images/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PhotoUploadSecret
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt PhotoEventBus.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ProcessDlq.Arn

  PhotosApiFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-photos-api-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PhotosApiFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PhotoUploadSecret
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt GalleriesTable.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${NewsletterEventBusName}

  AuthFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-auth
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/auth.handler
      Role: !GetAtt AuthFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecret
          TOKEN_TTL: '1800'

  InitFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-init
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/init.handler
      Role: !GetAtt InitFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecret
          UPLOADS_BUCKET: !Ref UploadsBucketName

  ProcessFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-process
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/process.handler
      Role: !GetAtt ProcessFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 120
      MemorySize: 1536
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecret
          IMAGES_BUCKET: !Ref ImagesBucketName
          PHOTOS_TABLE: !Ref PhotosTable
          PHOTO_EVENT_BUS: !Ref PhotoEventBus
          TICKETS_API_URL: https://api.micahwalter.com/tickets

  ProcessFnEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ProcessFn
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ProcessDlq.Arn

  PhotosApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-photos-api
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/photos-api.handler
      Role: !GetAtt PhotosApiFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref PhotoUploadSecret
          PHOTOS_TABLE: !Ref PhotosTable
          GALLERIES_TABLE: !Ref GalleriesTable
          SITE_URL: !Ref SiteUrl
          ADMIN_EMAIL: !Ref AdminEmail
          NEWSLETTER_EVENT_BUS_NAME: !Ref NewsletterEventBusName

  PhotosPlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: micahwalter-photos-place-index
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: SingleUse
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  PhotoEventBusArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: photo-bus-archive
      Description: Replay window for PhotoPendingEnrichment (U2 recovery)
      SourceArn: !GetAtt PhotoEventBus.Arn
      RetentionDays: 14

  EnrichFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-enrich-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EnrichFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ImagesBucketName}/images/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - geo:SearchPlaceIndexForPosition
                  - geo:DescribePlaceIndex
                Resource: !GetAtt PhotosPlaceIndex.Arn

  EnrichFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-enrich
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/enrich.handler
      Role: !GetAtt EnrichFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          IMAGES_BUCKET: !Ref ImagesBucketName
          PLACE_INDEX_NAME: !Ref PhotosPlaceIndex
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6

  PhotoPendingEnrichmentRule:
    Type: AWS::Events::Rule
    Properties:
      Name: photo-pending-enrichment
      Description: Route PhotoPendingEnrichment events to enricher
      EventBusName: !Ref PhotoEventBus
      EventPattern:
        source:
          - micahwalter.photos
        detail-type:
          - PhotoPendingEnrichment
      State: ENABLED
      Targets:
        - Id: EnrichFnTarget
          Arn: !GetAtt EnrichFn.Arn

  EnrichFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EnrichFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PhotoPendingEnrichmentRule.Arn

  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  InitIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InitFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  PhotosApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotosApiFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  AuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /auth
      Target: !Sub integrations/${AuthIntegration}

  InitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /upload-url
      Target: !Sub integrations/${InitIntegration}

  # Routes are relative to ApiMappingKey `photos` → https://api.micahwalter.com/photos/...
  # Gallery routes must be registered so GET /{id} never treats "galleries" as a photo id.
  GalleriesListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /galleries
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /galleries
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /galleries/{slug}
      Target: !Sub integrations/${PhotosApiIntegration}

  GalleriesPatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: PATCH /galleries/{slug}
      Target: !Sub integrations/${PhotosApiIntegration}

  # List: GET /photos/ (trailing slash) via GET /.
  # Do NOT add $default — with ApiMappingKey `photos`, $default intercepts OPTIONS
  # (breaking CORS unless perfectly handled) and bare GET /photos still 500s on this
  # custom domain. Clients must use trailing slash (see listPhotos in lib/photos-api.ts).
  PhotosListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosFeaturedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /featured
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: GET /{id}
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosPatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: PATCH /{id}
      Target: !Sub integrations/${PhotosApiIntegration}

  PhotosExposureTestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoApi
      RouteKey: POST /{id}/exposure-test
      Target: !Sub integrations/${PhotosApiIntegration}

  AuthFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/*/auth

  InitFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InitFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/*/upload-url

  PhotosApiFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PhotosApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/*/*

  ProcessFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessFn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${UploadsBucketName}

  ProcessFnErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: photo-upload-process-fn-errors
      AlarmDescription: photo-upload-process Lambda errored — an upload may not have been published
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # --- U7 FeedPublisher (scheduled photo RSS / sitemap artifacts) ---

  FeedPublisherFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-feed-publisher-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FeedPublisherFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:aws:s3:::${WebsiteBucketName}/*

  FeedPublisherFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-feed-publisher
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/feed-publisher.handler
      Role: !GetAtt FeedPublisherFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          WEBSITE_BUCKET: !Ref WebsiteBucketName
          SITE_URL: !Ref SiteUrl

  FeedPublisherSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: photo-feed-publisher-hourly
      Description: Refresh photos-feed.xml and sitemap-photos.xml on the website bucket
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: FeedPublisherFn
          Arn: !GetAtt FeedPublisherFn.Arn

  FeedPublisherSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FeedPublisherFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FeedPublisherSchedule.Arn

  # --- Exposure archive public API (api.micahwalter.com/exposures) ---

  ExposuresApiFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-exposures-api-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExposuresApiFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt ExposuresTable.Arn
                  - !Sub ${ExposuresTable.Arn}/index/*

  ExposuresApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-exposures-api
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/exposures-api.handler
      Role: !GetAtt ExposuresApiFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          EXPOSURES_TABLE: !Ref ExposuresTable

  ExposuresApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: photo-upload-exposures-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteUrl
          - http://localhost:3000
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 300
      Tags:
        Project: micahwalter-photo-upload
        ManagedBy: CloudFormation

  ExposuresApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExposuresApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExposuresApiFn.Arn}/invocations
      PayloadFormatVersion: '2.0'

  ExposuresListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExposuresApi
      RouteKey: GET /
      Target: !Sub integrations/${ExposuresApiIntegration}

  ExposuresGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExposuresApi
      RouteKey: GET /{n}
      Target: !Sub integrations/${ExposuresApiIntegration}

  ExposuresApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - ExposuresListRoute
      - ExposuresGetRoute
    Properties:
      ApiId: !Ref ExposuresApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ExposuresApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ExposuresApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref ExposuresApiStage
      ApiMappingKey: exposures

  ExposuresApiFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExposuresApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExposuresApi}/*/*/*

  # --- Exposure Sunday orchestrator (U3) ---

  ExposureCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ExposureCounterTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: micahwalter-photo-upload }
        - { Key: ManagedBy, Value: CloudFormation }

  ExposureOrchestratorFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-exposure-orchestrator-fn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExposureOrchestratorFnPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt ExposuresTable.Arn
                  - !Sub ${ExposuresTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt ExposureCounterTable.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${NewsletterEventBusName}
              - Effect: Allow
                Action: ses:SendEmail
                Resource: '*'

  ExposureOrchestratorFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-upload-exposure-orchestrator
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: src/exposure-orchestrator.handler
      Role: !GetAtt ExposureOrchestratorFnRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Sub ${LambdaArtifactsKeyPrefix}/photo-upload.zip
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          EXPOSURES_TABLE: !Ref ExposuresTable
          EXPOSURE_COUNTER_TABLE: !Ref ExposureCounterTable
          SITE_URL: !Ref SiteUrl
          ADMIN_EMAIL: !Ref AdminEmail
          SES_FROM_ADDRESS: !Ref AdminEmail
          NEWSLETTER_EVENT_BUS_NAME: !Ref NewsletterEventBusName

  ExposureSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-upload-exposure-scheduler-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeExposureOrchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExposureOrchestratorFn.Arn

  ExposureSundaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: exposure-sunday-send
      Description: Weekly Exposure newsletter — Sunday 09:00 America/New_York
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: cron(0 9 ? * SUN *)
      ScheduleExpressionTimezone: America/New_York
      Target:
        Arn: !GetAtt ExposureOrchestratorFn.Arn
        RoleArn: !GetAtt ExposureSchedulerRole.Arn

Outputs:

  ApiEndpoint:
    Description: Auto-generated API URL. Prefer https://api.micahwalter.com/photos.
    Value: !Sub https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com

  UploadsBucket:
    Description: Bucket that receives browser uploads
    Value: !Ref UploadsBucket

  PhotosTableName:
    Description: DynamoDB table for photo metadata
    Value: !Ref PhotosTable

  ExposuresTableName:
    Description: DynamoDB table for Exposure archive issues
    Value: !Ref ExposuresTable

  ExposuresApiEndpoint:
    Description: Prefer https://api.micahwalter.com/exposures
    Value: !Sub https://${ExposuresApi}.execute-api.${AWS::Region}.amazonaws.com

  ExposureOrchestratorFnName:
    Description: Sunday Exposure send orchestrator Lambda
    Value: !Ref ExposureOrchestratorFn

  ExposureCounterTableName:
    Description: Exposure issue counter + daily locks
    Value: !Ref ExposureCounterTable

  PhotoEventBusName:
    Description: EventBridge bus for PhotoPendingEnrichment (U2 consumer)
    Value: !Ref PhotoEventBus

  ProcessDlqUrl:
    Description: DLQ for process Lambda async failures
    Value: !Ref ProcessDlq

  PlaceIndexName:
    Description: AWS Location Place Index for reverse geocode
    Value: !Ref PhotosPlaceIndex

  EnrichFnName:
    Description: Enrichment Lambda function name
    Value: !Ref EnrichFn

  SecretArn:
    Description: Secrets Manager ARN — set passcode / hmac / ticketsPasscode after first deploy
    Value: !Ref PhotoUploadSecret

  FeedPublisherFnName:
    Description: Scheduled photo feed publisher Lambda
    Value: !Ref FeedPublisherFn
